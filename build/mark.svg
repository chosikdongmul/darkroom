<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Darkroom 마크: 헌팅캡을 쓴 동글동글한 아저씨(일자 앞머리, 가는 눈, 얇은 콧수염, 턱 아래 수염) -->
  <defs>
    <!-- 얼굴 윤곽: 넓고 둥글게, 아래 볼이 통통 -->
    <path id="face" d="M14.4 35 C14 27 21.8 23 32 23 C42.2 23 50 27 49.6 35 C50 42 49 48.4 45.6 52.6 C42.2 56.6 37.2 58.6 32 58.6 C26.8 58.6 21.8 56.6 18.4 52.6 C15 48.4 14 42 14.4 35 Z"/>
    <clipPath id="inFace"><use href="#face"/></clipPath>
    <!-- 헌팅캡: 둥근 몸통이 양옆에서 그대로 챙으로 이어지는 한 덩어리 -->
    <path id="cap" d="M11.2 30.2 C8.6 21.2 16 14 27.4 13.4 C37 12.8 47 14.2 51.8 18.6 C55.4 21.8 55.8 26.6 53.4 30 C52.2 31.6 50.2 32.4 47 32.2 C37.6 31.4 26.4 31.4 17 32.2 C13.8 32.4 12 31.6 11.2 30.2 Z"/>
    <clipPath id="inCap"><use href="#cap"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#e8823a"/>

  <!-- 상하좌우 여백이 같도록 가운데로(보이는 가장자리 9.1~55.8 × 12.4~59.5 → 배지 중심 32,32) -->
  <g transform="translate(-0.46 -3.94)" stroke="#231d1a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- 귀 -->
    <ellipse cx="13.6" cy="40" rx="3.6" ry="4.4" fill="#efcfb1"/>
    <ellipse cx="50.4" cy="40" rx="3.6" ry="4.4" fill="#efcfb1"/>
    <!-- 얼굴 바탕 -->
    <use href="#face" fill="#f4dcc4" stroke="none"/>
    <!-- 얼굴 안쪽에서만: 일자 앞머리, 턱 아래·입 아래 수염(옆 구레나룻 없이) -->
    <g clip-path="url(#inFace)" stroke="none">
      <path d="M10 20 L54 20 L54 33 C46 35 18 35 10 33 Z" fill="#191513"/>
      <path d="M10 62 L10 58.6 C15 58.6 18.6 54.6 22.4 54.4 C25 54.3 27.4 54.4 28.8 53.2 C29.8 52.3 34.2 52.3 35.2 53.2 C36.6 54.4 39 54.3 41.6 54.4 C45.4 54.6 49 58.6 54 58.6 L54 62 Z" fill="#231d1a"/>
    </g>
    <!-- 얼굴 윤곽선 -->
    <use href="#face" fill="none"/>

    <!-- 눈썹·눈 -->
    <path d="M22.4 36.2 L27.6 35.8" stroke-width="1.5" fill="none"/>
    <path d="M36.4 35.8 L41.6 36.2" stroke-width="1.5" fill="none"/>
    <ellipse cx="25.1" cy="39.4" rx="2.2" ry="1.3" fill="#231d1a" stroke="none"/>
    <ellipse cx="38.9" cy="39.4" rx="2.2" ry="1.3" fill="#231d1a" stroke="none"/>
    <!-- 코 -->
    <path d="M30.3 44 C31 45.2 33 45.2 33.7 44" stroke="#c99470" stroke-width="1.3" fill="none"/>
    <!-- 얇은 콧수염 -->
    <path d="M25.8 47.8 C28.2 46.4 30.4 46.2 32 47 C33.6 46.2 35.8 46.4 38.2 47.8 C36 48.2 34 48.2 32 47.8 C30 48.2 28 48.2 25.8 47.8 Z" fill="#231d1a" stroke-width="0.8"/>
    <!-- 입 -->
    <path d="M29.6 50.4 C31 51 33 51 34.4 50.4" stroke="#a86f57" stroke-width="1.2" fill="none"/>

    <!-- 헌팅캡 -->
    <use href="#cap" fill="#2b2420" stroke="none"/>
    <g clip-path="url(#inCap)" stroke="none">
      <!-- 챙 쪽을 살짝 어둡게: 몸통에서 부드럽게 넘어간다 -->
      <path d="M8 28.6 C18 26.4 46 26.4 56 28.6 L56 34 L8 34 Z" fill="#1d1916"/>
    </g>
    <path d="M16.4 24.6 C24 22.2 41 22.2 48.2 24.2" stroke="#4d4038" stroke-width="1.3" fill="none"/>
    <use href="#cap" fill="none"/>
  </g>
</svg>
