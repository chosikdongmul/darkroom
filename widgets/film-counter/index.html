<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Film Counter</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
  .card {
    position: absolute; inset: 12px; box-sizing: border-box; padding: 15px 18px 14px;
    border-radius: var(--dr-radius, 22px); background: var(--dr-bg, rgba(28, 28, 30, .72));
    box-shadow: var(--dr-shadow, 0 2px 8px rgba(0, 0, 0, .28));
    color: var(--dr-fg, #f5f5f7); font: 13px/1.3 var(--dr-font-ui, "Segoe UI", sans-serif);
    font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .muted { color: var(--dr-muted, rgba(235, 235, 245, .56)); }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .title { font-weight: 600; }
  .roll { font-size: 12px; font-weight: 500; }

  /* 카메라 컷 수 창: 홀수는 숫자, 짝수는 점, 가운데가 지금 컷. 양 끝은 서서히 사라짐 */
  .window {
    position: relative; height: 38px; border-radius: 12px;
    background: var(--dr-inset, rgba(0, 0, 0, .28));
    display: grid; grid-template-columns: repeat(7, 1fr); align-items: center; justify-items: center;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
  }
  .window span { font-family: var(--dr-font-num, sans-serif); font-size: calc(15px * var(--dr-num-scale, 1)); font-weight: 500; color: var(--dr-muted, rgba(235, 235, 245, .56));
                 font-variant-numeric: tabular-nums lining-nums; }
  .window span.dot { font-size: 9px; }
  .window span.center { color: var(--dr-accent, #ff9f45); font-size: calc(24px * var(--dr-num-scale, 1)); font-weight: 700; font-style: var(--dr-num-style, normal);
                        font-variation-settings: var(--dr-num-variation, normal); }
  .marker { position: absolute; left: 50%; top: 2px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--dr-accent, #ff9f45); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .stats div { display: flex; flex-direction: column; gap: 1px; }
  .stats b { font-family: var(--dr-font-num, sans-serif); font-size: calc(18px * var(--dr-num-scale, 1)); font-weight: var(--dr-num-weight, 600);
             letter-spacing: var(--dr-num-tracking, -0.02em); font-variation-settings: var(--dr-num-variation, normal); font-variant-numeric: tabular-nums lining-nums; }
  .stats span { font-size: 11px; font-weight: 500; color: var(--dr-muted, rgba(235, 235, 245, .56)); }
</style>
</head>
<body>
<main class="card" data-drag>
  <div class="top"><span class="title">오늘 찍은 사진</span><span class="roll muted" id="roll">롤 1</span></div>
  <div class="window" id="window"><i class="marker"></i></div>
  <div class="stats">
    <div><b id="week">–</b><span>이번 주</span></div>
    <div><b id="month">–</b><span>이번 달</span></div>
    <div><b id="total">–</b><span>전체</span></div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toLocaleString("ko-KR");
  let stats = null, nowMs = Date.now(), lastMinute = -1, rollText = "롤 1";

  /** 마지막 촬영이 얼마나 전인지(짧게) */
  function ago(iso) {
    if (!iso) return "기록 없음";
    const min = Math.floor((nowMs - new Date(iso).getTime()) / 60000);
    if (min < 1) return "방금";
    if (min < 60) return `${min}분 전`;
    if (min < 60 * 24) return `${Math.floor(min / 60)}시간 전`;
    return `${Math.floor(min / 1440)}일 전`;
  }

  /** 오른쪽 위: "롤 1 · 0/36 · 1일 전" (마우스를 올리면 설명) */
  function renderTop() {
    if (!stats) return;
    $("roll").textContent = `${rollText} · ${ago(stats.lastShotAt)}`;
    $("roll").title = `마지막 촬영: ${stats.lastShotAt ? stats.lastShotAt.replace("T", " ") : "없음"}`;
  }

  function render() {
    if (!stats) return;
    const per = Number(darkroom.settings.roll) || 36;
    const n = stats.today;
    // 오늘 n컷 → 롤 번호와 그 롤의 컷 번호(0컷이면 S = 장전 직후)
    const roll = n === 0 ? 1 : Math.floor((n - 1) / per) + 1;
    const frame = n === 0 ? 0 : ((n - 1) % per) + 1;
    rollText = `롤 ${roll} · ${frame}/${per}`;

    const win = $("window");
    win.querySelectorAll("span").forEach((s) => s.remove());
    for (let k = -3; k <= 3; k++) {
      const v = frame + k;
      const s = document.createElement("span");
      if (v < 0 || v > per) s.textContent = "";
      else if (v === 0) s.textContent = "S";
      else if (k !== 0 && v % 2 === 0) { s.textContent = "•"; s.className = "dot"; }
      else s.textContent = String(v);
      if (k === 0) s.className = "center";
      win.append(s);
    }
    $("week").textContent = fmt(stats.week);
    $("month").textContent = fmt(stats.month);
    $("total").textContent = fmt(stats.total);
    renderTop();
  }

  darkroom.subscribe("photos.stats", (s) => { stats = s; render(); });
  darkroom.subscribe("time.now", (v) => {
    nowMs = v.epochMs;
    const m = Math.floor(nowMs / 60000);
    if (m !== lastMinute) { lastMinute = m; renderTop(); }
  });
  darkroom.onSettingsChanged(render);
</script>
</body>
</html>
