<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>D-day</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
  [hidden] { display: none !important; }
  .card {
    position: absolute; inset: 12px; box-sizing: border-box; padding: 16px 20px 15px;
    border-radius: var(--dr-radius, 22px); background: var(--dr-bg, rgba(28, 28, 30, .72));
    box-shadow: var(--dr-shadow, 0 2px 8px rgba(0, 0, 0, .28));
    color: var(--dr-fg, #f5f5f7); font: 13px/1.3 var(--dr-font-ui, "Segoe UI", sans-serif);
    font-variant-numeric: tabular-nums; display: flex; flex-direction: column; justify-content: space-between;
  }
  .muted { color: var(--dr-muted, rgba(235, 235, 245, .56)); }
  .main { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
  .d { font-family: var(--dr-font-num, sans-serif); font-weight: var(--dr-num-weight, 600); font-size: calc(48px * var(--dr-num-scale, 1));
       line-height: .9; letter-spacing: var(--dr-num-tracking, -0.03em); font-variation-settings: var(--dr-num-variation, normal);
       font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
  .d small { font-size: .5em; letter-spacing: 0; margin-right: 2px; color: var(--dr-muted, rgba(235, 235, 245, .56)); }
  .d.today { color: var(--dr-accent, #ff9f45); }
  .what { text-align: right; min-width: 0; }
  .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .date { font-size: 12px; margin-top: 3px; }
  .rest { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--dr-faint, rgba(235, 235, 245, .14)); padding-top: 9px; }
  .row { display: flex; gap: 10px; font-size: 12px; }
  .row b { font-family: var(--dr-font-num, sans-serif); font-weight: var(--dr-num-weight, 600); font-variant-numeric: tabular-nums lining-nums; min-width: 52px; }
  .row span:last-child { margin-left: auto; }
  .empty { font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
<main class="card" data-drag>
  <div class="muted" id="label">다가오는 날</div>
  <div class="main" id="main">
    <div class="d" id="d">–</div>
    <div class="what"><div class="name" id="name"></div><div class="date muted" id="date"></div></div>
  </div>
  <div class="rest" id="rest"></div>
  <div class="empty muted" id="empty" hidden>Manager에서 이 위젯의 설정에<br>날짜를 넣어 주세요. 예: 2026-12-25 크리스마스</div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const DAY = 864e5, DOW = "일월화수목금토";
  let lastKey = "";

  // "2026-12-25 크리스마스" / "12-25 크리스마스"(매년) → [{ name, date }] (오늘 이후, 가까운 순)
  function parseEvents(text, today) {
    const out = [];
    for (const part of String(text || "").split(/[,\n]/)) {
      const m = part.trim().match(/^(?:(\d{4})[-./])?(\d{1,2})[-./](\d{1,2})\s*(.*)$/);
      if (!m) continue;
      const [, y, mo, d, name] = m;
      let date = new Date(y ? +y : today.getFullYear(), +mo - 1, +d);
      if (!y && date < today) date = new Date(today.getFullYear() + 1, +mo - 1, +d); // 매년: 지났으면 내년
      if (date < today || isNaN(date)) continue;
      out.push({ name: name.trim() || "이름 없음", date });
    }
    return out.sort((a, b) => a.date - b.date);
  }

  function label(days) {
    if (days === 0) return "D-DAY";
    return `D-${days}`;
  }

  function render(nowMs) {
    const now = new Date(nowMs);
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const s = darkroom.settings;
    const key = `${today.toDateString()}|${s.events}|${s.countToday}`;
    if (key === lastKey) return;
    lastKey = key;

    const events = parseEvents(s.events, today);
    const days = (e) => Math.round((e.date - today) / DAY) + (s.countToday && e.date > today ? 1 : 0);
    const fmt = (d) => `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
    $("empty").hidden = events.length > 0;
    $("main").hidden = $("rest").hidden = $("label").hidden = events.length === 0;
    if (!events.length) return;

    const [first, ...others] = events;
    const n = days(first);
    $("d").className = "d" + (n === 0 ? " today" : "");
    $("d").innerHTML = n === 0 ? "D-DAY" : `<small>D−</small>${n}`;
    $("name").textContent = first.name;
    $("date").textContent = first.date.getFullYear() !== today.getFullYear() ? `${first.date.getFullYear()}년 ${fmt(first.date)}` : fmt(first.date);
    $("label").textContent = n === 0 ? "오늘" : "다가오는 날";
    $("rest").replaceChildren(...others.slice(0, 2).map((e) => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<b></b><span></span><span class="muted"></span>`;
      row.children[0].textContent = label(days(e));
      row.children[1].textContent = e.name;
      row.children[2].textContent = fmt(e.date);
      return row;
    }));
    $("rest").hidden = others.length === 0;
  }

  darkroom.subscribe("time.now", (v) => render(v.epochMs));
  darkroom.onSettingsChanged(() => { lastKey = ""; render(Date.now()); });
  render(Date.now());
</script>
</body>
</html>
