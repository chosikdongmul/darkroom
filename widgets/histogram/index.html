<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Histogram</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
  [hidden] { display: none !important; }
  .card {
    position: absolute; inset: 12px; box-sizing: border-box; padding: 15px 18px 14px;
    border-radius: var(--dr-radius, 22px); background: var(--dr-bg, rgba(28, 28, 30, .72));
    box-shadow: var(--dr-shadow, none);
    color: var(--dr-fg, #f5f5f7); font: 13px/1.3 var(--dr-font-ui, "Segoe UI", sans-serif);
    font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; gap: 9px;
  }
  .muted { color: var(--dr-muted, rgba(235, 235, 245, .56)); }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .title { font-weight: 600; }
  .clip { display: flex; gap: 10px; font-size: 11.5px; font-weight: 500; color: var(--dr-muted, rgba(235, 235, 245, .56)); }
  .clip span { display: flex; align-items: center; gap: 5px; }
  .clip i { width: 6px; height: 6px; border-radius: 50%; background: var(--dr-faint, rgba(235, 235, 245, .2)); }
  .clip i.on.shadow { background: #6ea2ff; }
  .clip i.on.high { background: #ff6b5c; }
  .plot { position: relative; flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; background: var(--dr-plot, rgba(0, 0, 0, .24)); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grid { display: none; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--dr-muted, rgba(235, 235, 245, .56)); }
  .caption { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .caption span { overflow: hidden; text-overflow: ellipsis; color: var(--dr-muted, rgba(235, 235, 245, .56)); }
  .caption b { font-family: var(--dr-font-ui, sans-serif); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 11.5px; }
</style>
</head>
<body>
<main class="card" data-drag>
  <div class="top">
    <span class="title">히스토그램</span>
    <span class="clip"><span title="암부 클리핑"><i class="shadow" id="cs"></i>암부 <em id="csv" style="font-style:normal">–</em></span><span title="명부 클리핑"><i class="high" id="ch"></i>명부 <em id="chv" style="font-style:normal">–</em></span></span>
  </div>
  <div class="plot"><canvas id="c"></canvas><div class="empty" id="empty">배경화면을 읽는 중…</div></div>
  <div class="caption"><span id="name"></span><b id="exp"></b></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const canvas = $("c");
  let hist = null;

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, w, h);
    $("empty").hidden = !!hist;
    if (!hist) return;

    const area = (values, fill, stroke) => {
      const n = values.length, step = w / (n - 1);
      ctx.beginPath();
      ctx.moveTo(0, h);
      values.forEach((v, i) => ctx.lineTo(i * step, h - (Math.min(1000, v) / 1000) * (h - 2 * dpr)));
      ctx.lineTo(w, h);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = dpr; ctx.stroke(); }
    };
    if ((darkroom.settings.mode || "RGB") === "RGB") {
      // 채널을 더해 겹치는 부분이 노랑·청록·흰색이 되게(라이트룸과 같은 방식)
      ctx.globalCompositeOperation = "lighter";
      area(hist.r, "rgba(255, 90, 80, .5)");
      area(hist.g, "rgba(80, 215, 120, .5)");
      area(hist.b, "rgba(80, 140, 255, .5)");
      ctx.globalCompositeOperation = "source-over";
      area(hist.l, null, "rgba(255, 255, 255, .45)");
    } else {
      area(hist.l, "rgba(220, 220, 220, .45)", "rgba(255, 255, 255, .7)");
    }
    $("cs").classList.toggle("on", hist.shadowsClipped >= 0.5);
    $("ch").classList.toggle("on", hist.highlightsClipped >= 0.5);
    $("csv").textContent = `${hist.shadowsClipped}%`;
    $("chv").textContent = `${hist.highlightsClipped}%`;
  }

  // 지금 배경화면의 히스토그램(배경화면이 바뀌면 함께 바뀐다)
  darkroom.subscribe("wallpaper.histogram", (v) => { hist = v; draw(); });
  darkroom.subscribe("wallpaper.current", (p) => {
    const e = p && p.exif;
    $("name").textContent = p ? (e && e.camera ? `${e.camera} · ${p.name}` : p.name) : "배경화면 없음";
    $("name").title = p ? p.name : "";
    $("exp").textContent = e ? [e.aperture, e.shutter, e.iso && `ISO ${e.iso}`].filter(Boolean).join(" ") : "";
  });
  darkroom.onSettingsChanged(draw);
  new ResizeObserver(draw).observe(canvas);
</script>
</body>
</html>
