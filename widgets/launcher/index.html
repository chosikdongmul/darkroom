<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>바로가기</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
  [hidden] { display: none !important; }
  .card {
    position: absolute; inset: 12px; box-sizing: border-box; padding: 14px 16px;
    border-radius: var(--dr-radius, 22px); background: var(--dr-bg, rgba(28, 28, 30, .72));
    box-shadow: var(--dr-shadow, 0 2px 8px rgba(0, 0, 0, .28));
    color: var(--dr-fg, #f5f5f7); font: 12px/1.3 var(--dr-font-ui, "Segoe UI", sans-serif);
    display: grid; grid-template-columns: repeat(4, 1fr); align-content: center; gap: 10px 6px;
  }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; min-width: 0; }
  .tile {
    width: 52px; height: 52px; border-radius: calc(var(--dr-radius, 22px) * .55); display: grid; place-items: center;
    background: var(--dr-inset, rgba(0, 0, 0, .28)); box-shadow: inset 0 0 0 1px var(--dr-faint, rgba(235, 235, 245, .12));
    font-family: var(--dr-font-num, sans-serif); font-weight: var(--dr-num-weight, 600); font-size: 21px;
    transition: box-shadow .12s, transform .12s;
  }
  .tile img { width: 34px; height: 34px; }
  .item:hover .tile { box-shadow: inset 0 0 0 1.5px var(--dr-accent, #ff9f45); }
  .item:active .tile { transform: scale(.94); }
  .item.err .tile { box-shadow: inset 0 0 0 1.5px #e5484d; }
  .name { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dr-muted, rgba(235, 235, 245, .7)); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--dr-muted, rgba(235, 235, 245, .56)); line-height: 1.5; }
</style>
</head>
<body>
<main class="card" id="grid" data-drag></main>
<script>
  const grid = document.getElementById("grid");

  // 설정 [{ name, target }] (최대 8개)
  const parse = (list) => (Array.isArray(list) ? list : []).filter((x) => x && x.target).slice(0, 8);

  // 이름의 첫 글자(영문은 대문자). 이모지 등도 한 글자로 센다.
  const mono = (name) => ([...String(name).trim()][0] || "?").toUpperCase();
  const isWeb = (t) => /^https?:/i.test(t);

  function render() {
    const items = parse(darkroom.settings.items);
    if (!items.length) {
      grid.innerHTML = `<div class="empty">트레이 아이콘 → Manager → 바로가기에서<br>"+ 앱", "+ 폴더", "+ 웹 주소"로 추가하세요.</div>`;
      return;
    }
    grid.replaceChildren(...items.map(({ name, target }) => {
      const el = document.createElement("div");
      el.className = "item";
      el.title = target;
      el.dataset.noDrag = ""; // 타일은 누르면 열리고, 빈 곳을 끌면 위젯이 움직인다
      el.innerHTML = `<div class="tile"></div><div class="name"></div>`;
      const tile = el.children[0];
      tile.textContent = mono(name);
      if (!isWeb(target)) {
        // 앱·폴더는 Windows 아이콘. 못 가져오면 첫 글자 그대로.
        const img = new Image();
        img.alt = "";
        img.onload = () => { tile.textContent = ""; tile.classList.add("has-icon"); tile.append(img); };
        img.src = "https://assets.darkroom/icon?t=" + encodeURIComponent(target);
      }
      el.children[1].textContent = name || target;
      el.addEventListener("click", () => darkroom.action({ type: "open", target }));
      return el;
    }));
  }

  darkroom.onSettingsChanged(render);
  render();
</script>
</body>
</html>
