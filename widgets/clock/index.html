<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Exposure Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card" data-drag>
    <div class="row">
      <div class="time"><span id="ampm" class="ampm"></span><span id="hm">--:--</span><span id="sec" class="sec">--</span></div>
      <div class="date"><span id="md">--</span><span id="day" class="muted">--</span></div>
    </div>
    <div id="decor" class="decor">
      <div class="exp"><span id="exp" title="지금 밖에서 찍는다면 맞는 노출 (해 위치·날씨 기준 추정)"></span><span id="ev" class="muted"></span></div>
      <div class="meter" title="지금 밝기 EV 2(어두움) ~ 17(밝음)">
        <div class="ticks"></div><div class="track"></div><div class="dot" id="needle"></div>
      </div>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
